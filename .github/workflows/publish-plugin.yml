name: Publish plugin

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-plugin.yml, 'scripts/*.py']
  workflow_dispatch:
    inputs:
      mode:
        description: Preview, publish and prune, or retry interrupted cleanup
        type: choice
        options: [preview, publish, retry-cleanup]
        default: preview
      submission:
        description: Release submission JSON (leave blank to audit in preview mode)
        type: string
        required: false

permissions: {}
concurrency:
  group: official-plugin-catalog
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main' && inputs.mode != 'retry-cleanup'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Test and prepare the catalog
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode || 'preview' }}
          SUBMISSION: ${{ inputs.submission }}
        run: |
          python3 -B -m unittest discover -s scripts
          if [[ "$MODE" == preview && -z "$SUBMISSION" ]]; then
            python3 scripts/publish.py audit
          else
            python3 scripts/publish.py prepare "$RUNNER_TEMP/prepared"
          fi
      - name: Require read access to the private validator repository
        env:
          CORE_READ_TOKEN: ${{ secrets.NEXORA_CORE_READ_TOKEN }}
        run: |
          if [[ -z "$CORE_READ_TOKEN" ]]; then
            echo 'Set the NEXORA_CORE_READ_TOKEN Actions secret with Contents: Read access to ConRaD-1009/nexora.' >&2
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: ConRaD-1009/nexora
          ref: 43f3026cf762c17fe8b19f83d7973d95cad9396d
          path: nexora-validator
          token: ${{ secrets.NEXORA_CORE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify every new platform package
        env:
          NEXORA_MARKETPLACE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          cargo +stable build --locked --manifest-path nexora-validator/Cargo.toml -p nexora-core
          validator=nexora-validator/target/debug/nexora-core
          store="https://github.com/$GITHUB_REPOSITORY"
          if [[ -f "$RUNNER_TEMP/prepared/index.v1.json" ]]; then
            "$validator" marketplace check-official-index "$store" \
              "$RUNNER_TEMP/prepared/index.v1.json" index.v1.json
          else
            "$validator" marketplace check-official-index "$store" index.v1.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: inputs.mode == 'publish'
        with:
          name: verified-publication
          path: ${{ runner.temp }}/prepared/
          if-no-files-found: error
          retention-days: 1

  update:
    needs: verify
    if: >-
      ${{ always() && github.ref == 'refs/heads/main' &&
          github.event_name == 'workflow_dispatch' &&
          (inputs.mode == 'retry-cleanup' || (inputs.mode == 'publish' && needs.verify.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: inputs.mode == 'publish'
        with:
          name: verified-publication
          path: ${{ runner.temp }}/prepared/
      - name: Publish and clean up
        if: inputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish.py publish "$RUNNER_TEMP/prepared"
      - name: Resume pending cleanup
        if: inputs.mode == 'retry-cleanup'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish.py cleanup
